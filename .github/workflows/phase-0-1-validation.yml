name: Phase 0-1 validation
on:
  push:
    branches: [feature/phase-0-1-local-first-ux]
  pull_request:
    branches: [main]
permissions:
  contents: read
  checks: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build runtime bundles
        run: npm run build:runtime
      - name: Check JavaScript syntax
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('node:child_process');
            const files = ['main.js','preload.js','renderer.js','music-taste-analysis.js','work-manager.js','ux-enhancements.js','services/work-coordinator.js','workspace-layout.js','workspace-openrouter-ui.js','services/openrouter-service.js'];
            const failures = [];
            for (const file of files) {
              try { execSync('node --check ' + file, { encoding: 'utf8', stdio: 'pipe' }); }
              catch (error) { failures.push(file + '\n' + String(error.stderr || error.stdout || error.message)); }
            }
            const summary = failures.length ? failures.join('\n\n').slice(-55000) : 'All JavaScript syntax checks passed.';
            const checks = await github.rest.checks.listForRef({ owner: context.repo.owner, repo: context.repo.repo, ref: context.sha });
            const current = checks.data.check_runs.find(run => run.name === 'validate' && run.app?.slug === 'github-actions');
            if (current) await github.rest.checks.update({ owner: context.repo.owner, repo: context.repo.repo, check_run_id: current.id, output: { title: 'JavaScript syntax check', summary } });
            if (failures.length) core.setFailed('JavaScript syntax errors found. See this check run summary.');
      - name: Run Phase 4 taste-analysis tests
        run: node --test tests/music-taste-analysis.test.js
      - name: Run Electron browser smoke test
        run: xvfb-run -a npx electron --no-sandbox --disable-gpu scripts/browser-smoke.js
